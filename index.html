<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEC Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-image: url("httt.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;            
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(33, 4, 160, 0.425);                        
            border: 1px solid rgba(255, 255, 255, 3.0);
            padding: 36px 32px;
            width: 480px;
            max-width: 95vw;
            
        }
        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            margin-bottom: 24px;
        }       
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .input-row input {
            flex: 1;
            padding: 10px 14px;            
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.2);
            color: #ffffff;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            outline: none;
        }
        .input-row input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        .input-row input:focus {
            border-color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.25);
        }
        .add-btn {
            padding: 10px 18px;           
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.25);
            color: #ffffff;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 1.0s;
        }
        .add-btn:hover {
            background: rgba(255,255,255,0.4);
        }       
        .task-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;           
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(41, 37, 37, 0.548);
            margin-bottom: 8px;
            transition: opacity 1.0s;
        }
        .task-card.done {
            opacity: 5.0;
        }
        .task-card.done .task-text {
            text-decoration: line-through;
            color: rgba(0, 0, 0, 0.5);
        }       
        .check-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 1.0s;
        }
        .task-card.done .check-btn {
            background: rgba(100,220,150,0.7);
            border-color: translucent;
        }
        .task-text {
            flex: 1;
            color: #ffffff;
            font-size: 14px;
        }      
        .del-btn {
            background: transparent;
            border: none;
            color: rgb(0, 0, 0);
            font-size: 18px;
            cursor: pointer;
            opacity: 1;
            line-height: 1;
        }      
        .empty {
            text-align: center;
            color: rgba(14, 7, 7, 0.829);
            font-size: 13px;
            padding: 1.5rem 0;
        }        
        .stats {
            font-size: 12px;
            color: rgba(31, 12, 12, 0.801);
            margin-top: 12px;
            text-align: right;
        }       
    </style>
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="rush - BL1THE.mp3" type="audio/mpeg">
    </audio>
    <div class="container">
        <h1>TO-DO List</h1>
        <p class="subtitle"></p>
        <div class="input-row">
            <input type="text" id="taskInput" placeholder="Add a new task..." />
            <button class="add-btn" onclick="addTask()">+ Add</button>
        </div>
        <div id="taskList"></div>
        <p class="stats" id="stats"></p>
    </div>
    <script>
        // this part is from claude  
        const music = document.getElementById("bgMusic");
        let musicPlaying = false;      
        function tryPlay() {
            if (!musicPlaying) {
                music.play().then(() => {
                    musicPlaying = true;
                    document.getElementById("musicBtn").textContent = "🎵";
                    music.volume = 0.1;
                }).catch(() => {});
            }
            document.removeEventListener("click", tryPlay);
            document.removeEventListener("keydown", tryPlay);
        }
        document.addEventListener("click", tryPlay);
        document.addEventListener("keydown", tryPlay);
       
        let tasks = JSON.parse(localStorage.getItem("pec-tasks")) || [];
        let nextId = tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
        function save() {
            // Every time tasks change, save them to the browser
            localStorage.setItem("pec-tasks", JSON.stringify(tasks));
        }
        function addTask() {
            let text = document.getElementById("taskInput").value.trim();
            if (text === "") return;
            tasks.push({ id: nextId++, text: text, done: false });
            document.getElementById("taskInput").value = "";
            save();
            render();
        }
        function toggle(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
            save();
            render();
        }
        function remove(id) {
            tasks = tasks.filter(t => t.id !== id);
            save();
            render();
        }
        function render() {
            const list = document.getElementById("taskList");
            if (tasks.length === 0) {
                list.innerHTML = '<p class="empty">No tasks yet — add one above!</p>';
            } else {
                list.innerHTML = tasks.map(t => `
                    <div class="task-card ${t.done ? 'done' : ''}">
                        <button class="check-btn" onclick="toggle(${t.id})">
                            ${t.done ? '✓' : ''}
                        </button>
                        <span class="task-text">${t.text}</span>
                        <button class="del-btn" onclick="remove(${t.id})">×</button>
                    </div>
                `).join("");
            }
            const done = tasks.filter(t => t.done).length;
            document.getElementById("stats").textContent =
                tasks.length === 0 ? "" : `${done} of ${tasks.length} tasks completed`;
        }
        document.getElementById("taskInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") addTask();
        });
        render();
    </script>
</body>
</html>
